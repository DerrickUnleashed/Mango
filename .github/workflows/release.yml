name: Release

# Cut a release by pushing a version tag: `git tag v0.1.0 && git push origin v0.1.0`.
#
# The tag is validated against the Python package versions before anything is
# published, so a tag that disagrees with the source is rejected rather than
# shipping an image whose version lies. The web package is checked too, which
# is what caught it sitting at 0.0.0 while everything else was 0.1.0.
#
# The image is published to GHCR from the same Dockerfile that
# docker-compose.yml builds, so a release is exactly the artifact the deploy
# path consumes.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Pinned for the same reason as ci.yml: the ubuntu-latest label migrates to
# Ubuntu 26 from 2026-10-19, and the image a release is built on should not
# change without a commit.
jobs:
  verify:
    name: Verify tag matches source
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag agrees with every package version
        id: check
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          failed=0
          for file in apps/api/pyproject.toml ml/pyproject.toml package.json apps/web/package.json; do
            # Matches both `version = "x"` (TOML) and `"version": "x"` (JSON).
            declared=$(sed -nE 's/.*"?version"?[[:space:]]*[:=][[:space:]]*"([^"]+)".*/\1/p' "$file" | head -1)
            if [ -z "$declared" ]; then
              echo "::error::could not read a version from $file"
              failed=1
            elif [ "$declared" != "$version" ]; then
              echo "::error::$file declares $declared but the tag says $version"
              failed=1
            else
              echo "ok: $file is $declared"
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "::error::tag $tag does not match the source versions; bump the manifests or retag"
            exit 1
          fi

  image:
    name: Build and publish image
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # GHCR requires a fully lowercase image path, and github.repository is
      # `DerrickUnleashed/Mango` - capital M. Passing it straight through
      # fails before the build starts with "repository name must be
      # lowercase", so the name is normalised here once and reused for both
      # tags and the login.
      - name: Resolve the image name
        id: image
        run: |
          set -euo pipefail
          repo="$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "name=ghcr.io/$repo" >> "$GITHUB_OUTPUT"
          echo "Publishing to ghcr.io/$repo"

      # No uv or Python setup needed here: the image build does its own
      # `uv sync` inside the container.
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # build-push-action builds before pushing, so a build failure never
      # leaves a broken tag or a partially published image. Building it
      # separately first as well would just double the wall time.
      - name: Build and publish the image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.verify.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

  release:
    name: Create the GitHub release
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract this version's section from the changelog
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # awk alone, from the version's heading to the end of the file. It
          # already carries the `[x.y.z]:` link reference at the bottom of the
          # changelog, because the reference lines sit under the last `## `
          # heading with no further heading to stop at. An earlier version also
          # grepped for that reference and appended it, which emitted it twice
          # in the release notes.
          awk -v want="[${version}]" '
            /^## / { emit = index($0, want) > 0 }
            /^## / && !emit { next }
            emit { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version; add it before tagging"
            exit 1
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Publish release notes from the changelog
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # The section extracted above, so the notes match CHANGELOG.md
          # rather than being regenerated by GitHub and drifting from it.
          body_path: release-notes.md
          draft: true
