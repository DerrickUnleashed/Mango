name: Security

# Dependency and secret scanning. Kept separate from CI so a vulnerability
# is obviously a security signal rather than a test failure, and so it can
# be tuned without touching the build gate.
#
# Note: `actions/dependency-review-action` is intentionally absent. It needs
# GitHub Advanced Security, which is not available on this repository's plan
# (individual account, private repo), and it exits with "Dependency review is
# not supported on this repository" rather than skipping. The two audit jobs
# above already cover the dependency tree; dependency-review would only add
# per-PR diff visibility. It is worth adding if this repo ever moves to an
# organisation or a plan with GHAS.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because advisories for already-pinned versions are published
    # after the fact. Without this, a scan only ever runs on push.
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a leaked key is still a leak after it is removed
          # in a later commit.
          fetch-depth: 0

      # The gitleaks CLI is run directly rather than through
      # gitleaks/gitleaks-action. On pull_request events that action takes a
      # code path which writes PR annotations through the API, and it fails
      # here with "Resource not accessible by integration" because
      # GITHUB_TOKEN is read-only on this repository; it also ignores the
      # pinned version on that path. The CLI needs no token, behaves
      # identically on push, pull request, and the weekly schedule, and is
      # the exact invocation verified against this history.
      - name: Scan history for secrets (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.28.0
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect \
            --source . \
            --redact \
            --config .gitleaks.toml \
            --verbose

  python-audit:
    name: Python vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Audit the API dependency tree
        run: |
          uv export --project apps/api --frozen --no-emit-workspace --no-dev -q > /tmp/api-reqs.txt
          uvx pip-audit -r /tmp/api-reqs.txt --no-deps

      - name: Audit the ML dependency tree
        run: |
          uv export --project ml --frozen --no-emit-workspace --no-dev -q > /tmp/ml-reqs.txt
          uvx pip-audit -r /tmp/ml-reqs.txt --no-deps

  npm-audit:
    name: Node vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit the npm dependency tree
        run: npm audit --audit-level=moderate
