name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (API + ML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install workspace dependencies
        run: uv sync --frozen --project apps/api --group dev

      - name: Lint (API)
        run: |
          uv run --project apps/api ruff check apps/api/app apps/api/tests apps/api/migrate.py apps/api/alembic
          uv run --project apps/api ruff format --check apps/api/app apps/api/tests apps/api/migrate.py apps/api/alembic

      - name: Lint (ML)
        run: |
          uv run --project ml ruff check ml/orchardvision_ml ml/tests
          uv run --project ml ruff format --check ml/orchardvision_ml ml/tests

      - name: Test API
        run: uv run --project apps/api pytest apps/api/tests -q

      - name: Test ML
        run: uv run --project ml pytest ml/tests -q

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Test
        run: npm test

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build --workspace=apps/web
