name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, because advisories for already-pinned versions are published
    # after the fact. Without this, a scan only ever runs when something is
    # pushed. Monday 06:17 UTC, deliberately off the hour to avoid the
    # crowded top-of-hour scheduling window.
    - cron: "17 6 * * 1"

permissions:
  contents: read

# Runner image is pinned to ubuntu-24.04 rather than ubuntu-latest on
# purpose. The `latest` label migrates to Ubuntu 26 from 2026-10-19, which
# would move the image under the project without a commit, and glibc, OpenCV
# and the Chromium dependencies the E2E job installs are all sensitive to
# that. Bump this deliberately, on its own, with the test suite run.
jobs:
  backend:
    name: Backend (API + ML)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Sole writer of the uv cache. The two uv jobs further down restore
          # it but do not save. When all three saved, they raced for the same
          # key ("Unable to reserve cache ... another job may be creating
          # this cache") and the surviving entries were 0 bytes, so the cache
          # was producing a warning and no benefit at all. This job runs the
          # real workspace sync, so it is the right one to own the write.
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install workspace dependencies
        run: uv sync --frozen --project apps/api --group dev

      - name: Lint (API)
        run: |
          uv run --project apps/api ruff check apps/api/app apps/api/tests apps/api/migrate.py apps/api/alembic
          uv run --project apps/api ruff format --check apps/api/app apps/api/tests apps/api/migrate.py apps/api/alembic

      - name: Lint (ML)
        run: |
          uv run --project ml ruff check ml/orchardvision_ml ml/tests
          uv run --project ml ruff format --check ml/orchardvision_ml ml/tests

      - name: Typecheck (API)
        run: |
          uv run --project apps/api mypy --config-file apps/api/pyproject.toml \
            apps/api/app apps/api/migrate.py --exclude '__main__\.py'

      - name: Typecheck (ML)
        run: uv run --project ml mypy --config-file ml/pyproject.toml ml/orchardvision_ml

      - name: Test API
        run: uv run --project apps/api pytest apps/api/tests -q

      # Coverage is produced by pytest addopts in apps/api/pyproject.toml, so
      # the coverage gate and the test gate cannot drift apart.
      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-api
          path: apps/api/coverage.xml
          if-no-files-found: ignore

      - name: Test ML
        run: uv run --project ml pytest ml/tests -q

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Test
        run: npm run test:coverage

      - name: Upload web coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-web
          path: apps/web/coverage/lcov.info
          if-no-files-found: ignore

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build --workspace=apps/web

  # End-to-end tests drive a real browser against the real API and dev server.
  # Deliberately its own job rather than a step in Frontend (Web): it needs
  # Python, the API, and a browser, none of which that job has, and folding it
  # in would make the fast feedback loop wait on the slowest check.
  #
  # Intentionally NOT a required status check. This is the only suite that
  # depends on wall-clock timing, a video decode and a background job, so it is
  # the most likely source of an intermittent red. It reports every run; make
  # it required once it has a track record of stability.
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Restore only. See the note on the backend job: exactly one job
          # writes this cache, and it is not this one.
          restore-cache: true
          save-cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: |
          uv sync --project apps/api --group dev
          npm ci

      - name: Install the browser
        working-directory: apps/web
        # --with-deps installs the shared libraries Chromium needs, which are
        # not present on a bare runner image.
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/playwright-report
          if-no-files-found: ignore

  # Security checks run only after the build and tests pass (`needs`). They
  # are listed here rather than in a separate workflow because `needs` cannot
  # span workflow files, and these are required status checks, so a failure
  # in either blocks the merge.
  #
  # All three are kept despite the "Security" name: a job named for the class
  # of problem it catches reads clearly in the checks list, and they stay
  # separate jobs so one failing does not hide the others.
  #
  # `actions/dependency-review-action` is intentionally absent. It needs GitHub
  # Advanced Security, which is not available on this repository's plan
  # (individual account, private repo), and it exits with "Dependency review is
  # not supported on this repository" rather than skipping. The two audit jobs
  # cover the dependency tree; dependency-review would add per-PR diff
  # visibility. Worth adding if this ever moves to an organisation or a plan
  # with GHAS.

  secret-scan:
    name: "Security: Secret scan"
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a leaked key is still a leak after it is removed
          # in a later commit.
          fetch-depth: 0

      # The gitleaks CLI is run directly rather than through
      # gitleaks/gitleaks-action. On pull_request events that action takes a
      # code path which writes PR annotations through the API, and it fails
      # here with "Resource not accessible by integration" because
      # GITHUB_TOKEN is read-only on this repository; it also ignores the
      # pinned version on that path. The CLI needs no token, behaves
      # identically on push, pull request, and the weekly schedule, and is
      # the exact invocation verified against this history.
      - name: Scan history for secrets (gitleaks)
        run: |
          set -euo pipefail
          GITLEAKS_VERSION=8.28.0
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect \
            --source . \
            --redact \
            --config .gitleaks.toml \
            --verbose

  python-audit:
    name: "Security: Python vulnerabilities"
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Restore only. See the note on the backend job: exactly one job
          # writes this cache, and it is not this one.
          restore-cache: true
          save-cache: false

      # --no-deps is correct here, despite pip-audit warning about it. The
      # warning is aimed at requirements files that list only direct
      # dependencies, where skipping resolution would miss transitives.
      # `uv export` emits the fully resolved graph instead - every
      # transitive included, each pinned and hashed - so the list handed to
      # pip-audit is already the resolved set and nothing is missed.
      #
      # Dropping the flag was measured rather than assumed: it made this job
      # go from 2m13s to 5m12s, because pip-audit then installs the tree in a
      # throwaway venv and the ML export pulls ~800MB of torch. It found
      # nothing extra, reporting "No known vulnerabilities found" either way.
      #
      # --no-emit-workspace is what makes the export installable at all, by
      # dropping the editable local ./ml member that cannot be hash-checked.
      - name: Audit the API dependency tree
        run: |
          uv export --project apps/api --frozen --no-emit-workspace --no-dev -q > /tmp/api-reqs.txt
          uvx pip-audit -r /tmp/api-reqs.txt --no-deps

      - name: Audit the ML dependency tree
        run: |
          uv export --project ml --frozen --no-emit-workspace --no-dev -q > /tmp/ml-reqs.txt
          uvx pip-audit -r /tmp/ml-reqs.txt --no-deps

  npm-audit:
    name: "Security: Node vulnerabilities"
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Audit the npm dependency tree
        run: npm audit --audit-level=moderate

