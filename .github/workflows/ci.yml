name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (API + ML)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install workspace dependencies
        run: uv sync --frozen --project apps/api --group dev

      - name: Lint (API)
        run: |
          uv run --project apps/api ruff check apps/api/app apps/api/tests
          uv run --project apps/api ruff format --check apps/api/app apps/api/tests

      - name: Test API
        run: uv run --project apps/api pytest apps/api/tests -q

      - name: Test ML
        run: uv run --project ml pytest ml/tests -q

  frontend:
    name: Frontend (Web)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Lint
        run: npx --yes oxlint@1.82.0
        working-directory: apps/web

      - name: Test
        run: npm run test --workspace=apps/web

      - name: Format check
        run: npm run format:check --workspace=apps/web

      - name: Build
        run: npm run build --workspace=apps/web
