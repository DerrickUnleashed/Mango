[project]
name = "orchardvision-api"
version = "0.1.0"
description = "FastAPI backend for OrchardVision fruit tracking platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "orchardvision-ml>=0.1.0",
    "alembic>=1.19.2",
    "celery[redis]>=5.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "aiosqlite>=0.20",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S108"]

[tool.ruff.format]
quote-style = "double"
