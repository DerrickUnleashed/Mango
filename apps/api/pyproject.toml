[project]
name = "orchardvision-api"
version = "0.1.0"
description = "FastAPI backend for OrchardVision fruit tracking platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "orchardvision-ml>=0.1.0",
    "alembic>=1.19.2",
    "celery[redis]>=5.6.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "httpx2>=2.13.1",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Scoped to this one message rather than ignoring ResourceWarning wholesale,
# so a real unclosed file or socket would still be reported.
#
# The pooled SQLite connections are still open when the interpreter tears
# down, and CPython warns as it collects them. This is a shutdown-order
# artifact, not a leak: the engine pool is bounded, `get_db` releases every
# session, and test_database.py asserts both. Suppressing the message
# without that assertion would hide the symptom whether or not a cause
# existed.
filterwarnings = [
    "error",
    "ignore:unclosed database in:ResourceWarning",
]
# --cov-fail-under=85 is a ratchet: the measured value is 89% with branch
# coverage, so this blocks a drop without blocking unrelated work. Raise it
# as tests are added.
addopts = "--cov=app --cov-report=term-missing:skip-covered --cov-report=xml --cov-branch --cov-fail-under=85"

[tool.coverage.run]
source = ["app"]
# The `__main__` CLI entrypoint is a thin process wrapper that the test
# suite drives through the app instead, so it never runs under test.
omit = ["app/__main__.py"]

[tool.coverage.report]
# The gate itself is --cov-fail-under in addopts above; fail_under here does
# not affect pytest's exit code, so it is deliberately not repeated.
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S108"]

[tool.ruff.format]
quote-style = "double"
