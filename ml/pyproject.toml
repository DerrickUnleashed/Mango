[project]
name = "orchardvision-ml"
version = "0.1.0"
description = "ML pipeline for Visibility-Aware Self-Supervised Identity Learning"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "ultralytics>=8.0.0",
]

# Real (non-mock) training and inference. torch/torchvision were previously
# only present transitively via ultralytics, so `ml` imported them in
# identity/torch_{extractor,trainer}.py without declaring them and the
# imports broke if a future ultralytics release stopped pulling torch in.
# These stay optional: mock mode, evaluation, and the Celery/API runtime all
# work without them, and the torch-gated tests skip cleanly when absent.
[project.optional-dependencies]
torch = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
]
# TAPNext++ point tracking needs its own stack on top of torch: einops is a
# hard import of the vendored model code in tracking/tapnext, and requests is
# used by the checkpoint downloader script. The tracker never imports these
# at package import time, so this extra is only for the script user and the
# GPU runtime that actually selects TRACKER_BACKEND=tapnext.
tapnext = [
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "einops>=0.8",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "pytest-cov>=7.1.0",
    "mypy>=2.3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchardvision_ml"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# --cov-fail-under=80 is a ratchet: the measured value is 85% with branch
# coverage, so this blocks a drop without blocking unrelated work. Raise it
# as tests are added.
addopts = "--cov=orchardvision_ml --cov-report=term-missing:skip-covered --cov-branch --cov-fail-under=80"

[tool.coverage.run]
source = ["orchardvision_ml"]
# tracking/tapnext is vendored upstream source (Google DeepMind), exercised
# only when torch is installed and a GPU is available. Keep it out of the
# measurement like other code that needs real weights to run.
omit = ["*/tracking/tapnext/*"]

[tool.coverage.report]
# The gate itself is --cov-fail-under in addopts above; fail_under here does
# not affect pytest's exit code, so it is deliberately not repeated.
# torch_extractor and torch_trainer stay in the measurement: they read low
# because most of their code needs real weights and a GPU, which is worth
# seeing rather than hiding.
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored TAPNext++ source keeps upstream's 2-space, JAX-style formatting on
# purpose (byte-fidelity to google-deepmind/tapnet); skip it in lint/format.
extend-exclude = ["orchardvision_ml/tracking/tapnext"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
# Vendored TAPNext++ source is excluded for the same reason it is skipped by
# ruff and coverage: it must stay byte-faithful to upstream rather than be
# reworked to satisfy the project's mypy profile.
exclude = "orchardvision_ml/tracking/tapnext"
# Third-party stubs are incomplete for the heavy dependencies (ultralytics,
# opencv, torch) and installing their stubs is not an option here, so missing
# imports are ignored rather than silenced per-import.
ignore_missing_imports = true
# Errors are reported with file and line. Disabling the error summary keeps
# the CI output to the errors themselves.
pretty = false
warn_unused_ignores = true
# A code checker that passes on a broken annotation is worse than none, so
# redundant ignores are reported: a type: ignore that stops being necessary
# gets flagged rather than accumulating.
warn_redundant_casts = true

[[tool.mypy.overrides]]
# torchvision ships no py.typed marker, so mypy reports it as untyped even
# though torch itself is fine. Scoped to the one module so a genuinely
# missing import elsewhere is still an error.
module = ["torchvision.*"]
ignore_missing_imports = true
