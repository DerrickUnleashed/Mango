server {
    listen 80;
    server_name _;

    # Docker's embedded DNS: re-resolve the "api" service at runtime so nginx
    # keeps working even if the API container restarts with a new IP.
    resolver 127.0.0.11 valid=30s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    # Allow large video uploads (matches MAX_UPLOAD_BYTES=2GB)
    client_max_body_size 2g;

    # Gzip static assets
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API: reverse-proxy to the FastAPI backend (all routes under /api)
    location /api/ {
        set $backend http://api:8001;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Don't buffer large video/file responses so seeking works
        proxy_buffering off;
    }

    # SPA: serve built React app with client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}